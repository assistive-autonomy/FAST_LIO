name: fast_lio_headless

services:
  headless:
    image: ${FAST_LIO_IMAGE:-fast-lio2-headless-humble:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_NAME: ${CONTAINER_USER:-ros}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    init: true
    network_mode: none
    restart: "no"
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    environment:
      FAST_LIO_WS: /opt/fast_lio_ws
      LIVOX_WS: /opt/ws_livox
      ROS_LOCALHOST_ONLY: "1"
    command: ["ros2", "run", "fast_lio", "fastlio_headless", "--help"]
