# Full-topic compatibility overrides for playing Jazzy-recorded MCAP bags with
# ROS 2 Humble. Every recorded topic is listed because Humble cannot decode the
# string-valued QoS metadata written by Jazzy.

/robot_description: &reliable_transient_local_depth_1
  reliability: reliable
  durability: transient_local
  history: keep_last
  depth: 1
/tf_static: *reliable_transient_local_depth_1
/vehicle/dbw_enabled: *reliable_transient_local_depth_1

/diagnostics: &reliable_volatile_depth_1
  reliability: reliable
  durability: volatile
  history: keep_last
  depth: 1
/sensor/camera/fsp_l/meta: *reliable_volatile_depth_1
/sensor/camera/fsp_r/meta: *reliable_volatile_depth_1
/sensor/camera/lspf_r/meta: *reliable_volatile_depth_1
/sensor/camera/lspr_l/meta: *reliable_volatile_depth_1
/sensor/camera/rsp_l/meta: *reliable_volatile_depth_1
/sensor/camera/rsp_r/meta: *reliable_volatile_depth_1
/sensor/camera/rspf_l/meta: *reliable_volatile_depth_1
/sensor/camera/rspr_r/meta: *reliable_volatile_depth_1

