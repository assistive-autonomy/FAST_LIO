/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic: "/sensor/lidar/top/points"
            imu_topic: "/sensor/imu/front/data"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        tf:
            connect_sensor_tree: true
            imu_frame: "imu_fsp_r_sensor"
            base_frame: "base_footprint"

        preprocess:
            lidar_type: 5
            scan_line: 128
            scan_rate: 10
            timestamp_unit: 3
            blind: 1.0

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree: 360.0
            det_range: 120.0
            extrinsic_est_en: false
            extrinsic_T: [0.3549975547, 0.4234004139, 0.3354220656]
            extrinsic_R: [1.0000000000, -0.0000073464, -0.0000026536,
                          0.0000073464,  1.0000000000, -0.0000026536,
                          0.0000026536,  0.0000026536,  1.0000000000]

        publish:
            path_en: true
            effect_map_en: false
            map_en: false
            scan_publish_en: true
            dense_publish_en: true
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: false
            interval: -1
